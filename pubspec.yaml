name: quickboom_crm_customer
description: QB Suite customer CRM mobile app (leads, plans, marketplace).
publish_to: 'none'

version: 1.0.2+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  state_notifier: ^1.0.0
  riverpod_annotation: ^4.0.2
  dio: ^5.7.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  remixicon: ^4.9.3
  permission_handler: ^11.3.1
  connectivity_plus: ^7.3.1
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+22
  image_picker_platform_interface: ^2.10.0
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  razorpay_flutter: ^1.4.5
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  video_player: ^2.14.0
  youtube_player_flutter: ^10.0.1
  youtube_player_iframe: ^6.0.2
  local_auth: ^2.3.0
  share_plus: ^13.3.0
  intl: ^0.20.3
  quickboom_company_admin:
    path: ../company_admin_app

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/app_logo.png
    - assets/images/app_logo_brand.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
